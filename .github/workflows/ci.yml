name: delivery-pipeline

on:
  push:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: prepare environment
        run: cp .env.example .env

      - name: install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: generate application key
        run: php artisan key:generate

      - name: run automated tests
        run: php artisan test

      - name: check code style
        run: php vendor/bin/pint --test

  staging:
    name: staging
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: simulate staging deployment
        run: echo "staging deployment simulation completed"

  production:
    name: production
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 1 enable maintenance mode
        run: echo "php artisan down --retry=60"

      - name: 2 pull latest code
        run: echo "git pull origin main"

      - name: 3 install production dependencies
        run: echo "composer install --no-dev --optimize-autoloader"

      - name: 4 run database migrations
        run: echo "php artisan migrate --force"

      - name: 5 rebuild application cache
        run: |
          echo "php artisan config:cache"
          echo "php artisan route:cache"
          echo "php artisan view:cache"

      - name: 6 restart queue workers
        run: echo "php artisan queue:restart"

      - name: 7 disable maintenance mode
        run: echo "php artisan up"
